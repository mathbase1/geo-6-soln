/* Exact four-triangle Pythagoras dissection.
 * Geometric units: x = 8 for drawing only, other leg = 6.
 * Every triangle has area 24; each outer square has area 196.
 * Visible labels keep the unknown side symbolic as x.
 */
function proofDiagram(mode) {
  if (mode === 'both') {
    return '<div class="proof-stack" style="display:grid;grid-template-columns:minmax(0,1fr);gap:1.5rem">'
      + proofDiagram('one') + proofDiagram('two') + '</div>';
  }
  if (mode !== 'one' && mode !== 'two') mode = 'one';
  proofDiagram._serial = (proofDiagram._serial || 0) + 1;
  var id = 'pythagoras-' + mode + '-' + proofDiagram._serial;
  var ox = 68, oy = 74, unit = 26;
  var point = function (p) { return (ox + unit * p[0]) + ',' + (oy + unit * p[1]); };
  var polygon = function (points, fill, extra) {
    return '<polygon points="' + points.map(point).join(' ') + '" fill="' + fill
      + '" stroke="#f1f5f9" stroke-width="2.5" stroke-linejoin="round" ' + (extra || '') + '/>';
  };
  var label = function (x, y, text, size, colour, extra) {
    return '<text x="' + x + '" y="' + y + '" text-anchor="middle" dominant-baseline="middle"'
      + ' font-size="' + (size || 27) + '" font-weight="750" fill="' + (colour || '#f8fafc') + '" '
      + (extra || '') + '>' + text + '</text>';
  };
  var triangleColours = ['#704a76', '#2e6671', '#775d36', '#405b84'];
  var triangles = mode === 'one' ? [
    [[0,0],[8,0],[0,6]],
    [[14,0],[14,8],[8,0]],
    [[14,14],[6,14],[14,8]],
    [[0,14],[0,6],[6,14]]
  ] : [
    [[0,8],[8,8],[0,14]],
    [[14,0],[14,8],[8,0]],
    [[8,14],[0,14],[8,8]],
    [[8,8],[8,0],[14,8]]
  ];
  var description = mode === 'one'
    ? 'Four identical right triangles, each with legs x and 6 and hypotenuse 10, surround a square of side 10 and area 100. The outer square has side x plus 6.'
    : 'The same four right triangles are rearranged in the same size outer square. The remaining areas are one square of side x, area x squared, and one square of side 6, area 36.';
  var s = '<figure class="proof-figure" style="margin:0;min-width:0"><svg class="proof-svg"'
    + ' viewBox="0 0 500 530" xmlns="http://www.w3.org/2000/svg" role="img"'
    + ' aria-labelledby="' + id + '-title ' + id + '-desc"'
    + ' style="display:block;width:100%;height:auto;max-width:650px;margin-inline:auto;font-family:system-ui,sans-serif">'
    + '<title id="' + id + '-title">' + (mode === 'one' ? 'First arrangement: area 100' : 'Second arrangement: areas x squared and 36') + '</title>'
    + '<desc id="' + id + '-desc">' + description + '</desc>'
    + '<rect x="0" y="0" width="500" height="530" rx="18" fill="#101b2c"/>';
  if (mode === 'one') {
    s += polygon([[8,0],[14,8],[6,14],[0,6]], '#245c52');
  } else {
    s += polygon([[0,0],[8,0],[8,8],[0,8]], '#245c52');
    s += polygon([[8,8],[14,8],[14,14],[8,14]], '#476648');
  }
  triangles.forEach(function (p, i) { s += polygon(p, triangleColours[i]); });
  s += '<rect x="68" y="74" width="364" height="364" fill="none" stroke="#f1f5f9" stroke-width="3"/>';
  // Top boundary is visibly split into x and 6 in both arrangements.
  s += label(172, 48, 'x', 29) + label(354, 48, '6', 29);
  s += '<path d="M68 60V69 M276 60V69 M432 60V69" stroke="#cbd5e1" stroke-width="2"/>';
  if (mode === 'one') {
    s += label(40, 152, '6', 29) + label(40, 334, 'x', 29);
    s += '<path d="M54 74H63 M54 230H63 M54 438H63" stroke="#cbd5e1" stroke-width="2"/>';
    s += label(250, 250, '100', 45, '#e8fff4');
    s += label(250, 294, '10 × 10', 25, '#d6f8e7');
    // A label on one hypotenuse establishes the side of the central square.
    s += label(354, 178, '10', 29, '#ffffff',
      'transform="rotate(53.1301023542 354 178)" stroke="#101b2c" stroke-width="8" paint-order="stroke" stroke-linejoin="round"');
    // Small right-angle marks are entirely inside the corner triangles.
    s += '<path d="M68 89H83V74 M417 74V89H432 M432 423H417V438 M83 438V423H68"'
      + ' fill="none" stroke="#e2e8f0" stroke-width="2"/>';
  } else {
    s += label(40, 178, 'x', 29) + label(40, 360, '6', 29);
    s += '<path d="M54 74H63 M54 282H63 M54 438H63" stroke="#cbd5e1" stroke-width="2"/>';
    s += label(172, 166, 'x²', 43, '#e8fff4');
    s += label(172, 210, 'x × x', 25, '#d6f8e7');
    s += label(354, 350, '36', 40, '#efffed');
    s += label(354, 389, '6 × 6', 23, '#e0f6dc');
    s += '<path d="M68 297H83V282 M417 74V89H432 M261 438V423H276 M276 267H291V282"'
      + ' fill="none" stroke="#e2e8f0" stroke-width="2"/>';
  }
  // A common bracket states why the two complete outer squares have equal area.
  s += '<path d="M68 459V474H432V459" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>';
  s += label(250, 504, 'x + 6', 29, '#e2e8f0');
  s += '</svg></figure>';
  return s;
}

 if(n===6){let s='<svg class="support-svg" viewBox="0 0 450 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Counting from level2 up to level8 takes six one-unit steps."><line x1="40" y1="80" x2="410" y2="80" stroke="#172c3e" stroke-width="3"/>';
  for(let k=0;k<=6;k++){const x=40+k*370/6;s+=`<line x1="${x}" y1="71" x2="${x}" y2="89" stroke="#172c3e" stroke-width="2"/><text x="${x}" y="119" text-anchor="middle" font-size="26" font-weight="750">${k+2}</text>`;if(k<6)s+=`<path d="M${x+4} 66Q${x+31} 9 ${x+58} 66" fill="none" stroke="#007d70" stroke-width="3"/>`;}
  return s+'<text x="225" y="155" text-anchor="middle" font-size="23">Six steps from 2 up to 8</text></svg>';
 }
 if(n===10){let s='<svg class="support-svg" viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eight rows of eight unit squares make64.">';for(let y=0;y<8;y++)for(let x=0;x<8;x++)s+=`<rect x="${61+x*26}" y="${30+y*26}" width="26" height="26" fill="#a9dacc" stroke="white"/>`;return s+'<text x="165" y="22" text-anchor="middle" font-size="23">8 along</text><text x="28" y="141" text-anchor="middle" font-size="25">8</text><text x="165" y="269" text-anchor="middle" font-size="25" font-weight="750">8 × 8 = 64</text></svg>';}
 return '';
}

function extrasLabReport() {
  const big = Number(uiState.labR), small = Number(uiState.labr);
  const middle = 2 * Math.sqrt(big * small), width = big + middle + small;
  const f = n => Math.abs(n - Math.round(n)) < 1e-9 ? String(Math.round(n)) : n.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
  const approximate = n => Math.abs(n - Math.round(n * 1000) / 1000) > 1e-9 ? ' &asymp; ' : ' = ';
  return '<p><strong>Height difference:</strong> ' + f(big) + ' &minus; ' + f(small) + ' = ' + f(big - small) + '.</p>'
    + '<p><strong>Centre-to-centre distance:</strong> ' + f(big) + ' + ' + f(small) + ' = ' + f(big + small) + '.</p>'
    + E(['Across = ' + rt('(' + f(big + small) + ')² − (' + f(big - small) + ')²'), approximate(middle) + f(middle)])
    + E(['Full width = ' + f(big) + ' + ' + (Math.abs(middle - Math.round(middle)) < 1e-9 ? f(middle) : '2' + rt(f(big * small))) + ' + ' + f(small), approximate(width) + f(width)], 'answer')
    + '<p>Decimals are rounded to three decimal places. The drawing uses the unrounded lengths.</p>';
}

function extraPage(name) {
  const optional = '<p class="optional-note"><strong>Extra help:</strong> examine one idea here, then return to your current lesson step whenever you are ready.</p>';
  if (name === 'help') return '<h2>Choose what would help.</h2>' + optional
    + '<div class="action-list"><button data-page="questions">Explain a confusing part</button><button data-page="proof">Why Pythagoras works</button><button data-page="general">Derive the general formula</button><button data-page="lab">Try different radii</button><button data-page="notes">Read the complete paper solution</button><button data-page="source">See the original image</button><button data-page="all">Read every lesson step</button></div>';

  if (name === 'questions') return '<h2>Which connection feels unclear?</h2>'
    + '<div class="picture">' + boxScene(21, false) + '</div>'
    + '<details open><summary>The circles touch. How can there be a across length?</summary><p>The across length measures the horizontal spacing of the <strong>centre guides</strong>. The circles’ boundaries touch, but their centres occupy different horizontal positions. That is why the across length is not zero.</p></details>'
    + '<details><summary>Why can the radius lengths move down to the width strip?</summary><p>The vertical guides remain the same distance apart from top to bottom. A horizontal segment copied straight down between them keeps its length. Nothing is stretched.</p></details>'
    + '<details><summary>Why add 8 + 2, but also subtract 8 − 2?</summary><p>The two radii join <strong>end to end</strong> along the sloping centre line, so their lengths add to 10.</p><p>The two heights start from the <strong>same bottom level</strong>. The taller height contains the shorter 2, so removing that lower part leaves 6.</p></details>'
    + '<details><summary>Why does the little corner sit above the bottom?</summary><p>It is level with the blue centre, which is 2 above the bottom. The corner is the meeting of a horizontal line and the vertical guide through the yellow centre.</p></details>'
    + '<details><summary>Why use 100 − 36 instead of 10 − 6?</summary><p>Pythagoras relates <strong>square areas</strong>: the missing square area plus 6² equals 10². Thus we subtract 36 from 100. The lengths 10 and 6 point in different directions; they are not two consecutive pieces of one straight segment.</p></details>'
    + '<details><summary>Why does 64 become 8?</summary><p>Sixty-four is the missing square’s <strong>area</strong>. Eight is its <strong>side length</strong>, because 8 &times; 8 = 64. Taking the square root makes that conversion.</p></details>'
    + '<details><summary>Why are there two 8s in the answer?</summary><p>The left 8 is the given yellow radius. The middle 8 is the calculated horizontal spacing. Those different lengths happen to be equal in this question.</p></details>'
    + '<details><summary>Why not add the diameters, 16 + 4?</summary><p>The small circle sits diagonally beside the large circle. Their horizontal spans overlap, even though the circles themselves do not overlap. Adding both diameters would count that shared horizontal span twice.</p></details>'
    + '<details><summary>Must the box be square?</summary><p>No. Only its bottom and side walls are used. The top simply needs to be high enough to contain the circles.</p></details>';

  if (name === 'notes') return '<h2>The complete paper solution</h2>'
    + '<div class="picture">' + boxScene(21, false) + '</div>'
    + '<p>Draw vertical guides through both centres. The full width comprises the left radius, the horizontal spacing between those guides, and the right radius.</p>'
    + '<p><strong>1. Find the sloping distance between centres.</strong> The touching radii join end to end, giving 8 + 2 = 10.</p>'
    + '<p><strong>2. Find the vertical difference.</strong> Both circles touch the same bottom. Their centre heights are 8 and 2, giving 8 &minus; 2 = 6.</p>'
    + '<p><strong>3. Find the horizontal spacing.</strong> These lengths form a right triangle. By Pythagoras:</p>'
    + E(['Across² = 10² − 6²', '= 100 − 36', '= 64'])
    + E(['Across = ' + rt('64'), '= 8'])
    + '<p><strong>4. Assemble the full width.</strong></p>' + E(['8 + 8 + 2 = 18 units'], 'answer') + '<div class="return no-print"><button data-print class="primary">Print this solution</button></div>';

  if (name === 'source') return '<h2>The original question</h2>'
    + '<img class="source-img" src="' + SOURCE_IMAGE + '" alt="Original question: two touching circles of radii 8 and 2 touch the bottom and opposite walls of a rectangular box. Find the width.">'
    + '<p>The marked segments are radii. The circles touch each other, both touch the bottom, and they touch opposite side walls. The diagram is redrawn to exact proportions in the lesson.</p>';

  if (name === 'proof') {
    const mode = uiState.proofMode || 'one';
    const first = '<h3>Arrangement one: a square of area 100 remains.</h3>' + proofDiagram('one')
      + '<p>Each side of the central square is a triangle’s 10-unit side. Its area is 10 &times; 10 = 100.</p>'
      + '<details><summary>Why is the middle shape a square?</summary><p>All four sides are 10. At each corner, the two acute triangle angles sum to 90°. Together with the middle angle they make 180°, so the middle angle is also 90°.</p></details>';
    const second = '<h3>Arrangement two: two squares remain.</h3>' + proofDiagram('two')
      + '<p>The same four triangles now leave one square of side x and another of side 6. Their total area is x² + 36.</p>';
    return '<h2>Why the square areas add</h2>' + optional
      + '<p>In this optional proof, <strong>x means the across length</strong>. Each triangle is a copy of our right triangle, with sides x, 6 and 10.</p>'
      + '<div class="action-list"><button data-proof="one">First arrangement</button><button data-proof="two">Rearrange the triangles</button><button data-proof="both">Compare both</button></div>'
      + (mode === 'one' ? first : mode === 'two' ? second : first + second)
      + '<p>Both outer squares have side x + 6. Both contain the same four triangles, unchanged in size. Removing equal triangle areas from equal outer areas leaves equal remaining areas.</p>'
      + E(['x² + 36 = 100']) + '<p>That is why the missing square area is 100 &minus; 36.</p>';
  }

  if (name === 'general') return '<h2>The general formula, derived</h2>' + optional
    + '<p>Let <strong>R</strong> be the larger radius and <strong>r</strong> the smaller radius. Let <strong>x</strong> mean the across length. These are names for lengths.</p>'
    + draw({general: true, leftR: true, rightR: true}, 'Replace the original radii 8 and 2 by R and r.')
    + '<h3>1. Use the same right triangle.</h3><p>Its sloping side is R + r, because the radii join end to end. Its vertical side is R &minus; r, because the centres have those heights above the same bottom.</p>'
    + E(['x² + (R − r)² = (R + r)²'])
    + E(['x² = (R + r)²', '− (R − r)²'])
    + '<h3>2. Expand the first square.</h3>' + expansionDiagram(false)
    + '<p>Splitting both sides into R and r gives four areas: R², Rr, Rr and r². Here Rr means R &times; r.</p>'
    + E(['(R + r)² = R² + 2Rr + r²'])
    + '<h3>3. Expand the second square.</h3>' + expansionDiagram(true)
    + '<p>From an R-by-R square, remove a top strip and a right strip, each of area Rr. Their shared r-by-r corner was subtracted twice, so restore r² once.</p>'
    + E(['(R − r)² = R² − 2Rr + r²'])
    + '<h3>4. Subtract every term in the second bracket.</h3>'
    + E(['x² = (R² + 2Rr + r²)', '− (R² − 2Rr + r²)'])
    + '<p>The outside minus changes all three signs. In particular, subtracting &minus;2Rr gives +2Rr.</p>'
    + E(['x² = R² + 2Rr + r²', '− R² + 2Rr − r²'])
    + '<p>The R² terms cancel, and the r² terms cancel. Two copies of 2Rr remain.</p>'
    + E(['x² = 4Rr', 'x = 2' + rt('Rr')])
    + '<p>Squaring 2&radic;(Rr) gives 4Rr: the 2 squares to 4, and the square root squares back to Rr. Choose the positive length.</p>'
    + '<h3>5. Add the same three width pieces.</h3><p>The positive square root gives the middle length. Add the outer radius pieces:</p>'
    + E(['Full width = R + 2' + rt('Rr'), '+ r'], 'answer')
    + '<p>Putting R = 8 and r = 2 back in gives:</p>'
    + E(['8 + 2' + rt('16') + ' + 2', '= 8 + 8 + 2', '= 18'])
    + '<details><summary>When is this configuration possible?</summary><p>Both circles must fit between the walls. Since R is the larger radius, the calculated width must be at least its diameter 2R. A very tiny second circle can make the formula suggest a wall passing through the larger circle; that would not be the pictured arrangement.</p>'
    + E(['R + 2' + rt('Rr') + ' + r', '≥ 2R'])
    + '<p>The original case fits: its width 18 is at least the yellow diameter 16. Equal radii also work; the centres are level and the vertical difference is zero.</p></details>';

  if (name === 'lab') {
    const big = Number(uiState.labR), small = Number(uiState.labr), middle = 2 * Math.sqrt(big * small);
    const f = n => Math.abs(n - Math.round(n)) < 1e-9 ? String(Math.round(n)) : n.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
    return '<h2>Try different radii</h2>' + optional
      + '<p>The same contacts are kept as the radii change. Watch the across length change with them.</p>'
      + '<div class="control-block"><label for="lab-R">Larger radius: <output id="lab-R-read">' + f(big) + '</output></label><input id="lab-R" type="range" min="4" max="12" step="1" value="' + big + '"></div>'
      + '<div class="control-block"><label for="lab-r">Smaller radius: <output id="lab-r-read">' + f(small) + '</output></label><input id="lab-r" type="range" min="' + (big / 4) + '" max="' + big + '" step="0.25" value="' + small + '"></div>'
      + '<div class="action-list"><button data-preset="8,2">Original: 8 and 2</button><button data-preset="8,4">Try 8 and 4</button><button data-preset="5,5">Equal circles: 5 and 5</button></div>'
      + '<div id="lab-figure">' + draw({R: big, r: small, leftR: true, rightR: true, guides: true, widthParts: 'all', middle: f(middle), answer: true}) + '</div>'
      + '<div id="lab-report">' + extrasLabReport() + '</div>'
      + '<p>The smaller-radius slider runs from one quarter of the larger radius up to an equal radius. This range keeps both circles inside the box.</p>';
  }
  return '<h2>Choose an optional explanation.</h2><button data-page="help">Open the help menu</button>';
}

const uiState={step:0,page:'lesson',proofMode:'one',labR:8,labr:2,large:false};
let simpleFrame=0;
function simpleNav(){const i=uiState.step;return `<nav class="simple-nav no-print" aria-label="Lesson controls"><button data-move="-1" ${i===0?'disabled':''}>← Back</button><span class="counter">${i===0?'Start':`Step ${i} of 11`}</span>${i<11?'<button class="primary" data-move="1">'+(i===0?'Start →':'Next →')+'</button>':'<button data-page="notes">Paper solution</button>'}</nav>`;}
function mainPanel(i,continuous=false){const a=simpleSteps[i];return `<section class="simple-card ${i===0?'simple-cover':''}" aria-labelledby="title-${i}"><h1 id="title-${i}" tabindex="-1">${i===0?'HOW <em>WIDE</em> IS THE BOX?':a.title}</h1><figure class="single-figure">${simpleScene(i)}</figure><div class="plain-copy"><p>${a.text}</p>${a.equation?`<div class="simple-equation">${a.equation}</div>`:''}${i===3&&!continuous?'<button class="replay-one no-print" data-replay>Replay the copied 8</button>':''}<details class="simple-help"><summary>Show me why</summary>${a.help}${simpleSupport(i)}${i===8?'<div class="wide-action"><button data-page="proof">Show why Pythagoras works</button></div>':''}</details>${i===11?'<div class="after-answer no-print"><p>The original question is solved.</p><div class="wide-action"><button data-page="notes">The short written solution</button><button data-page="help">Optional explanations</button></div></div>':''}${i===0?'<div class="wide-action no-print" style="justify-content:center"><button class="primary" data-move="1">Start the first step →</button><button data-page="source">Original image</button></div>':''}</div></section>`;}
function renderSimple(scroll=true,play=false){
 if(simpleFrame)cancelAnimationFrame(simpleFrame);simpleFrame=0;
 document.body.classList.toggle('large-text',uiState.large);
 $('#text-button').textContent=uiState.large?'Standard text':'Larger text';$('#text-button').setAttribute('aria-pressed',String(uiState.large));
 if(uiState.page==='lesson')$('#app').innerHTML=simpleNav()+mainPanel(uiState.step)+simpleNav();
 else if(uiState.page==='all')$('#app').innerHTML='<div class="return no-print"><button data-page="lesson">← Return to my step</button></div><div class="simple-readall">'+simpleSteps.map((_,i)=>mainPanel(i,true)).join('')+'</div>';
 else $('#app').innerHTML=`<article class="card help-page"><div class="return no-print"><button data-page="lesson">← Return to my step</button>${uiState.page!=='help'?'<button data-page="help">Optional explanations</button>':''}</div>${extraPage(uiState.page)}<div class="return no-print"><button data-page="lesson">← Return to my step</button></div></article>`;
 if(uiState.page==='lab')updateLab();
 $('#status').textContent=uiState.page==='lesson'?simpleSteps[uiState.step].title:uiState.page;
 if(scroll)window.scrollTo({top:0,behavior:'instant'});
 if(play&&uiState.page==='lesson'&&uiState.step===3)copyEight();
}
function showStep(i){uiState.step=Math.max(0,Math.min(11,i));uiState.page='lesson';renderSimple(true,true);}
function copyEight(){
 if(simpleFrame)cancelAnimationFrame(simpleFrame);simpleFrame=0;
 const g=$('[data-ghost="copy-eight"]'),target=$('[data-lower-eight]');
 if(!g||!target||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 g.setAttribute('opacity','1');target.setAttribute('opacity','0');const start=performance.now();
 const run=now=>{const t=Math.min(1,(now-start)/1500),q=t*t*(3-2*t);g.setAttribute('transform',`translate(0 ${150*q})`);g.querySelector('text').setAttribute('y',String(213+2*q));
 if(t<1)simpleFrame=requestAnimationFrame(run);else{g.setAttribute('opacity','0');target.setAttribute('opacity','1');simpleFrame=0;}};simpleFrame=requestAnimationFrame(run);
}
function updateLab(){const R=uiState.labR,r=uiState.labr,m=2*Math.sqrt(R*r);$('#lab-figure').innerHTML=draw({R,r,leftR:true,rightR:true,guides:true,widthParts:'all',middle:fmt(m),answer:true},'The contacts stay the same as the radii change.');$('#lab-report').innerHTML=extrasLabReport();if($('#lab-R-read'))$('#lab-R-read').textContent=fmt(R);if($('#lab-r-read'))$('#lab-r-read').textContent=fmt(r);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-move'))showStep(uiState.step+Number(b.dataset.move));else if(b.dataset.page){uiState.page=b.dataset.page;renderSimple(true,false);}else if(b.hasAttribute('data-replay'))copyEight();else if(b.hasAttribute('data-restart'))showStep(0);else if(b.id==='text-button'){uiState.large=!uiState.large;renderSimple(false,false);}else if(b.hasAttribute('data-proof')){uiState.proofMode=b.dataset.proof;renderSimple(false,false);}else if(b.hasAttribute('data-preset')){[uiState.labR,uiState.labr]=b.dataset.preset.split(',').map(Number);renderSimple(false,false);}else if(b.hasAttribute('data-print'))window.print();});
document.addEventListener('input',e=>{if(e.target.id==='lab-R'){uiState.labR=Number(e.target.value);uiState.labr=Math.max(uiState.labR/4,Math.min(uiState.labR,uiState.labr));const r=$('#lab-r');r.min=String(uiState.labR/4);r.max=String(uiState.labR);r.value=String(uiState.labr);updateLab();}else if(e.target.id==='lab-r'){uiState.labr=Number(e.target.value);updateLab();}});
document.addEventListener('keydown',e=>{if(uiState.page!=='lesson'||e.ctrlKey||e.metaKey||e.altKey||/^(INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY)$/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();showStep(uiState.step+1);}else if(e.key==='ArrowLeft'){e.preventDefault();showStep(uiState.step-1);}});
window.simpleLesson={uiState,simpleSteps,simpleScene,simpleSupport,mainPanel,showStep,renderSimple,copyEight};
renderSimple(false,false);
</script></body></html>
